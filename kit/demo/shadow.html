<!doctype html>
<html lang="en" data-shell>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>Shadow header</title>
	<link rel="stylesheet" href="./kit.css" />
	<script src="./theme-init.js"></script>
	<script>
		// A header inside another component's shadow root, rendered before the kit's elements are defined.
		customElements.define("x-wrap", class extends HTMLElement {
			connectedCallback() {
				this.attachShadow({ mode: "open" }).innerHTML = '<tk-header aside-label="Details"><h1 slot="title">Nested</h1></tk-header>';
			}
		});
	</script>
	<script type="module">import "./kit.js"</script>
</head>
<body>
	<tk-shell nav-label="Pages" aside-label="Details">
		<nav slot="nav">Nav</nav>
		<x-wrap></x-wrap>
		<section slot="aside">Details</section>
	</tk-shell>
</body>
</html>

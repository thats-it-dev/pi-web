<!doctype html>
<html lang="en" data-shell>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>That's it kit</title>
	<link rel="stylesheet" href="./kit.css" />
	<script src="./theme-init.js"></script>
	<script type="module">import "./kit.js"</script>
	<style>
		nav { display: grid; gap: 10px; padding: 18px; }
		section { padding: 18px; display: grid; gap: 14px; align-content: start; overflow-y: auto; }
		.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
	</style>
</head>
<body>
	<tk-shell nav-label="Demo pages" aside-label="Details" store-key="kit-demo:panels">
		<nav slot="nav">
			<a class="u" href="#a">Page A</a>
			<a class="u" href="#b">Page B</a>
			<a class="u on" href="">This page</a>
		</nav>
		<tk-header menu-label="Open menu" aside-label="Details" aside-badge="3/7"><h1 slot="title">That's it kit</h1><button slot="actions" class="btn ghost" aria-label="New chat">+</button></tk-header>
		<section>
			<div class="row"><button class="btn">Primary</button><button class="btn ghost">Ghost</button></div>
			<div class="seg"><button class="on">One</button><button>Two</button></div>
			<div class="row"><span class="label">label</span><a class="u" href="#a">link</a><span class="dot live"></span><span class="dot running"></span><span class="dot needs_you"></span><span class="dot error"></span></div>
			<input placeholder="Text input" aria-label="Text input" />
			<div class="row">
				<button class="btn" id="open-sheet">Open sheet</button>
				<button class="btn ghost" id="show-toast">Show toast</button>
			</div>
		</section>
		<section slot="aside"><span class="label">details</span><p>Slotted details.</p><button class="btn ghost" id="open-sheet-2">Open sheet</button></section>
	</tk-shell>
	<script>
		// Query switches for the tests; a classic script runs before the deferred kit module upgrades tk-shell.
		(() => {
			const q = new URLSearchParams(location.search);
			const shell = document.querySelector("tk-shell");
			if (q.get("nav") === "0") shell.querySelector("[slot=nav]")?.remove();
			if (q.get("aside") === "0") shell.querySelector("[slot=aside]")?.remove();
			if (q.get("navhidden") === "1") shell.setAttribute("nav-hidden", "");
		})();
	</script>
	<tk-sheet id="sheet" heading="Sheet"><p>Slotted content.</p></tk-sheet>
	<tk-toasts></tk-toasts>
	<script type="module">
		import { toast, sharedStyles } from "./kit.js";
		// Light DOM doesn't get sharedStyles otherwise, so .btn/.seg would be unstyled.
		document.adoptedStyleSheets = [...document.adoptedStyleSheets, sharedStyles.styleSheet];
		const sheet = document.getElementById("sheet");
		for (const id of ["open-sheet", "open-sheet-2"]) document.getElementById(id)?.addEventListener("click", () => (sheet.open = true));
		sheet.addEventListener("tk-close", () => (sheet.open = false));
		document.getElementById("show-toast").addEventListener("click", () => toast("Saved"));
	</script>
</body>
</html>

name: kit

on:
  push:
    branches: [master]
    paths:
      - 'kit/**'
      - 'theme/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/kit.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; never cancel a half-uploaded deployment.
concurrency:
  group: kit-deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -w kit
      - run: npm run build -w kit
      # Compares the fresh build with what kit.thatsit.app serves: additive-only.
      - run: npm run check-api -w kit
      # cf 1.0.0-beta.14's `cf pages deploy` is a stub, so wrangler does the upload.
      - run: npx wrangler@4.149.0 pages deploy kit/dist --project-name thatsit-kit --branch "$BRANCH"
        env:
          BRANCH: ${{ github.ref_name }}
